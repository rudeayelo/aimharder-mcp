name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - name: Install hosted feasibility dependencies
        working-directory: hosted
        run: pnpm install --frozen-lockfile
      - name: Check hosted Worker types
        working-directory: hosted
        run: pnpm typecheck
      - name: Exercise authenticated Worker journey
        working-directory: hosted
        run: pnpm test
      - name: Build hosted Worker
        working-directory: hosted
        run: pnpm build
